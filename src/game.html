<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>黒に塗りつぶせ</title>
<!-- OGP（slug: black-friday → https://game.chozo.net/black-friday/） -->

<meta property="og:title" content="黒に塗りつぶせ">
<meta property="og:description" content="ボールを投げて「金曜日」を黒く塗れ！塗れた分だけ % OFF になる、ブラックフライデーのミニゲーム。">

<script>/*__FAVICON__*/</script>
<style>
  html, body { margin: 0; height: 100%; background: #050507; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  body { display: flex; align-items: center; justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans CJK JP", "Yu Gothic", "Meiryo", sans-serif; color: #fff; }
  #app { position: relative; overflow: hidden; background: radial-gradient(120% 70% at 50% 28%, #2a1c22 0%, #120c14 45%, #050507 100%); }
  #c { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #ui { position: absolute; inset: 0; pointer-events: none; }
  #ui button { pointer-events: auto; font-family: inherit; border: 0; cursor: pointer; }

  /* HUD */
  #hud { position: absolute; left: 0; right: 0; top: 0; padding: 3.2% 5% 0; display: flex; justify-content: space-between; align-items: flex-start; transition: opacity .3s; }
  .hudbox { background: rgba(0,0,0,.45); border: 1px solid rgba(255,210,120,.25); border-radius: 12px; padding: 6px 10px; }
  #balls { display: flex; gap: 6px; align-items: center; }
  #balls .lbl, #cov .lbl { font-size: 11px; color: #e9cf91; letter-spacing: .08em; margin-right: 4px; }
  .ball { width: 16px; height: 16px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #555 0%, #111 45%, #000 100%); box-shadow: 0 0 0 1.5px #e9cf91; transition: transform .25s, opacity .25s; }
  .ball.used { opacity: .18; transform: scale(.7); box-shadow: 0 0 0 1px #776; }
  #cov { text-align: right; }
  #covNum { font-size: 28px; font-weight: 900; line-height: 1; font-variant-numeric: tabular-nums; }
  #covNum small { font-size: 15px; }
  #covBar { margin-top: 4px; width: 110px; height: 6px; border-radius: 3px; background: linear-gradient(90deg, #f7d77a, #c8952c); overflow: hidden; }
  #covFill { height: 100%; width: 0%; background: #050505; transition: width .4s; }

  #reticle { position: absolute; width: 54px; height: 54px; margin: -27px 0 0 -27px; left: 50%; top: 50%; transition: opacity .2s; }
  #reticle svg { width: 100%; height: 100%; overflow: visible; filter: drop-shadow(0 0 2px rgba(0,0,0,.9)); }
  #hint { position: absolute; left: 0; right: 0; bottom: 19%; text-align: center; font-size: 13px; color: rgba(255,235,190,.85); text-shadow: 0 1px 3px #000; transition: opacity .4s; }
  #toast { position: absolute; left: 0; right: 0; top: 30%; text-align: center; font-size: 30px; font-weight: 900; opacity: 0; text-shadow: 0 2px 0 #000, 0 0 12px rgba(0,0,0,.8); pointer-events: none; }
  #toast.show { animation: toast 1.1s ease-out forwards; }
  @keyframes toast { 0% { opacity: 0; transform: translateY(14px) scale(.8); } 15% { opacity: 1; transform: translateY(0) scale(1.08); } 30% { transform: scale(1); } 75% { opacity: 1; } 100% { opacity: 0; transform: translateY(-24px); } }
  /* v5：ぬり範囲ゲージ（右側の縦バー） */
  /* v8：値は「色」ではなく「大きさ」で表す。トラックは上が太く下が細い（幅 26px → 6.5px、ぬり範囲 100% → 25% に比例）、
     マーカーは円で直径 = 26px × (0.25 + 0.75g)（＝その位置で投げたときの広がりの大きさ）。色は値によらず一色（ニュートラル）。 */
  #gauge { position: absolute; right: 2.5%; top: 23%; height: 42%; width: 58px; display: flex; flex-direction: column; align-items: center; transition: opacity .25s; }
  #gauge .glbl { font-size: 10px; font-weight: 800; color: #e9cf91; letter-spacing: .05em; white-space: nowrap; margin-bottom: 4px; text-shadow: 0 1px 2px #000; }
  #gTrack { position: relative; flex: 1; width: 26px; background: none; }
  #gTrack svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  #gTrack .tick { position: absolute; left: 50%; height: 1px; transform: translateX(-50%); background: rgba(255,255,255,.4); }
  #gMarker { position: absolute; left: 50%; top: 100%; width: 6.5px; height: 6.5px; border-radius: 50%; transform: translate(-50%, -50%); background: #f4f4f4;
    box-shadow: 0 0 0 2px #1a1a1a, 0 0 0 3px rgba(255,255,255,.55), 0 0 8px rgba(0,0,0,.6); }
  #gauge .gend { display: flex; align-items: center; gap: 4px; font-size: 9px; color: rgba(255,255,255,.75); }
  #gauge .gend.max { margin: 1px 0 15px; }   /* 上端の大きいマーカー（半径 13px）が MAX ラベルに重ならない余白 */
  #gauge .gend.min { margin: 6px 0 2px; }
  #gauge .gdot { display: inline-block; flex: none; border-radius: 50%; background: rgba(244,244,244,.8); box-shadow: 0 0 0 1px #1a1a1a; }
  #gPct { margin-top: 4px; font-size: 15px; font-weight: 900; font-variant-numeric: tabular-nums; color: #fff; text-shadow: 0 1px 3px #000; }
  /* v7：投げた瞬間に止まったゲージ（飛行中〜次の狙いまで）：マーカーと数値を金色に、数値の下に「決定」 */
  #gauge.frozen #gMarker { background: #ffd76a; box-shadow: 0 0 0 2px #fff, 0 0 10px rgba(255,215,106,.9); }
  #gauge.frozen #gPct { color: #ffd76a; }
  #gLock { font-size: 10px; font-weight: 900; color: #ffd76a; letter-spacing: .1em; text-shadow: 0 1px 2px #000; visibility: hidden; }
  #gauge.frozen #gLock { visibility: visible; }
  #gauge.hit #gMarker { background: #ff3b52; }
  #rangeFlash { position: absolute; left: 0; right: 0; top: 37%; text-align: center; font-size: 20px; font-weight: 900; color: #fff; opacity: 0; text-shadow: 0 2px 0 #000, 0 0 10px rgba(0,0,0,.8); pointer-events: none; }
  #rangeFlash.show { animation: toast 1.3s ease-out forwards; }
  #throwBtn { position: absolute; left: 50%; bottom: 5%; transform: translateX(-50%); width: 46%; height: 9%; border-radius: 999px;
    background: radial-gradient(circle at 50% 30%, #3a3a3a, #0b0b0b 70%); color: #ffe7a6; font-size: 24px; font-weight: 900; letter-spacing: .2em;
    box-shadow: 0 0 0 2px #d9ad4f, 0 6px 0 #6b4f18, 0 10px 24px rgba(0,0,0,.6); transition: transform .08s, opacity .2s; }
  #throwBtn:active { transform: translateX(-50%) translateY(3px); box-shadow: 0 0 0 2px #d9ad4f, 0 3px 0 #6b4f18; }
  #throwBtn:disabled { opacity: .45; cursor: default; }

  /* 画面（タイトル／結果） */
  /* BGM のオン／オフ（プレイ中と結果画面の左下） */
  #bgmBtn { position: absolute; left: 4%; bottom: 6.5%; width: 44px; height: 44px; border-radius: 50%; background: rgba(0,0,0,.5) !important; border: 1px solid rgba(255,210,120,.35) !important;
    display: flex; align-items: center; justify-content: center; padding: 0; transition: opacity .3s; z-index: 5; }
  #bgmBtn svg { width: 24px; height: 24px; display: block; }
  #bgmBtn .off { display: none; }
  #bgmBtn.muted .off { display: inline; }
  #bgmBtn.muted .note { opacity: .4; }
  .screen { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: auto; transition: opacity .35s; }
  .hidden, .hidden * { pointer-events: none !important; }
  .hidden { opacity: 0 !important; }
  #title { background: linear-gradient(180deg, rgba(5,5,7,.9) 0%, rgba(5,5,7,.4) 30%, rgba(5,5,7,.3) 55%, rgba(5,5,7,.92) 80%); justify-content: space-between; padding: 6% 0 5%; box-sizing: border-box; }
  .tTop { text-align: center; width: 100%; }
  /* v10：見出しは2段。上＝BLACK FRIDAY（金・横幅いっぱい）、下＝メインタイトル「黒に塗りつぶせ」（白・少し大きい、「黒」だけ金縁の黒） */
  #bfBig { font-size: calc(var(--w, 390px) * 0.118); font-weight: 900; line-height: 1.05; letter-spacing: .02em; white-space: nowrap; }
  .tMain { margin-top: 4px; font-size: calc(var(--w, 390px) * 0.128); font-weight: 900; line-height: 1.15; color: #fff; white-space: nowrap;
    text-shadow: 0 3px 0 #000, 0 0 14px rgba(0,0,0,.9); }
  .tMain .kuro { color: #050505; -webkit-text-stroke: 2px #ffd76a; paint-order: stroke fill; text-shadow: 0 0 10px rgba(255,215,106,.55); }
  .gold { background: linear-gradient(180deg, #fff3c4 0%, #f2c75a 45%, #a8741c 100%); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 2px 0 #3a2508); }
  .tBot { text-align: center; width: 92%; }
  /* v10：絵で見る遊び方（3ステップ） */
  #howto { display: flex; align-items: stretch; justify-content: center; gap: 2px; margin-bottom: 12px; }
  .step { position: relative; flex: 1 1 0; min-width: 0; background: rgba(0,0,0,.62); border: 1px solid rgba(255,210,120,.35); border-radius: 12px; padding: 6px 2px 6px; display: flex; flex-direction: column; align-items: center; }
  .sNum { position: absolute; left: 4px; top: 4px; width: 20px; height: 20px; border-radius: 50%; background: #ffd76a; color: #1a1006; font-size: 14px; font-weight: 900; line-height: 20px; text-align: center; }
  .sPic { display: block; width: 100%; height: 72px; }
  .sCap { margin-top: 4px; font-size: 14px; font-weight: 800; line-height: 1.3; color: #fff; letter-spacing: -.03em; white-space: nowrap; }
  .sCap .sub { color: #ffd76a; }
  .sArrow { flex: none; align-self: center; width: 10px; font-size: 13px; color: #ffd76a; text-align: center; margin-top: -24px; }
  .bigBtn { width: 100%; height: 56px; border-radius: 999px; font-size: 21px; font-weight: 900; letter-spacing: .12em;
    background: linear-gradient(180deg, #ffe08a, #d39b2c); color: #1a1006; box-shadow: 0 5px 0 #6d4a10, 0 10px 24px rgba(0,0,0,.6); }
  .bigBtn:active { transform: translateY(3px); box-shadow: 0 2px 0 #6d4a10; }

  #result { background: rgba(3,3,5,.55); }
  .card { width: 84%; box-sizing: border-box; background: linear-gradient(180deg, #151515, #050505); border: 2px solid #d9ad4f; border-radius: 18px; padding: 18px 16px 18px; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,.7); transform: scale(.9); transition: transform .45s cubic-bezier(.2,1.6,.4,1); }
  #result:not(.hidden) .card { transform: scale(1); }
  .ribbon { display: inline-block; background: #e8273f; color: #fff; font-weight: 900; font-size: 13px; letter-spacing: .3em; padding: 4px 10px 4px 14px; border-radius: 4px; }
  #rPct { font-size: 76px; font-weight: 900; line-height: 1; margin-top: 12px; font-variant-numeric: tabular-nums; }
  #rPct small { font-size: 34px; }
  .rOff { font-size: 20px; font-weight: 900; margin-top: 2px; }
  #rTier { margin-top: 12px; font-size: 18px; font-weight: 900; color: #ffd76a; }
  #rMsg { margin-top: 6px; font-size: 13px; color: #ddd; line-height: 1.6; }
  .rShop { margin: 12px 0 16px; font-size: 14px; color: #fff; }
  #rStats { font-size: 11px; color: #999; margin-bottom: 14px; }
</style>
</head>
<body>
<div id="app">
  <canvas id="c"></canvas>
  <div id="ui">
    <div id="hud">
      <div class="hudbox" id="balls"><span class="lbl">のこり</span></div>
      <div class="hudbox" id="cov"><div><span class="lbl">黒塗り</span><span id="covNum">0<small>%</small></span></div><div id="covBar"><div id="covFill"></div></div></div>
    </div>
    <div id="reticle"><svg viewBox="-27 -27 54 54">
      <circle r="17" fill="none" stroke="#ffe08a" stroke-width="2.5"/>
      <circle r="2.5" fill="#ff3b52"/>
      <path d="M0 -25V-12M0 25V12M-25 0H-12M25 0H12" stroke="#ffe08a" stroke-width="2.5" stroke-linecap="round"/>
    </svg></div>
    <div id="hint">ドラッグで狙う → 投げる</div>
    <div id="toast"></div>
    <div id="rangeFlash"></div>
    <div id="gauge"><div class="glbl">ぬり範囲</div><div class="gend max"><span class="gdot" style="width:26px;height:26px"></span>MAX</div>
      <div id="gTrack"><svg viewBox="0 0 26 100" preserveAspectRatio="none"><polygon id="gShape" points="0,0 26,0 16.25,100 9.75,100" fill="rgba(255,255,255,0.16)" stroke="rgba(255,255,255,0.8)" stroke-width="1.5" vector-effect="non-scaling-stroke" stroke-linejoin="round"/></svg>
        <div class="tick" style="top:25%;width:28.4px"></div><div class="tick" style="top:50%;width:22.8px"></div><div class="tick" style="top:75%;width:17.1px"></div><div id="gMarker"></div></div>
      <div class="gend min"><span class="gdot" style="width:6.5px;height:6.5px"></span>MIN</div><div id="gPct">25%</div><div id="gLock">決定</div></div>
    <button id="throwBtn">投げる</button>
    <button id="bgmBtn" aria-label="BGM オン／オフ" title="BGM オン／オフ（M キー）"><svg viewBox="0 0 24 24"><path class="note" d="M9 18.5a3 3 0 1 1-2-2.83V5l12-2.5v12a3 3 0 1 1-2-2.83V7.1L9 8.8z" fill="#ffe08a"/><path class="off" d="M3 3 21 21" stroke="#ff3b52" stroke-width="2.6" stroke-linecap="round"/></svg></button>

    <div id="title" class="screen">
      <div class="tTop" id="tTop">
        <div id="bfBig" class="gold">BLACK FRIDAY</div>
        <h1 class="tMain" id="tMain" style="margin-bottom:0"><span class="kuro">黒</span>に塗りつぶせ</h1>
      </div>
      <div class="tBot">
        <div id="howto">
          <div class="step" id="step1"><div class="sNum">1</div>
            <svg class="sPic" viewBox="0 0 110 72" aria-hidden="true">
              <defs><linearGradient id="hgGold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff3c4"/><stop offset=".45" stop-color="#f2c75a"/><stop offset="1" stop-color="#a8741c"/></linearGradient>
                <marker id="hgArrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#fff"/></marker></defs>
              <text x="47" y="45" font-size="42" font-weight="900" fill="url(#hgGold)" text-anchor="middle">金</text>
              <g transform="translate(49 28)"><circle r="11" fill="none" stroke="#ffe08a" stroke-width="2.2"/><path d="M0 -16V-7M0 16V7M-16 0H-7M16 0H7" stroke="#ffe08a" stroke-width="2.2" stroke-linecap="round"/><circle r="2" fill="#ff3b52"/></g>
              <path d="M96 48 Q 92 29 69 29" fill="none" stroke="#fff" stroke-width="2.2" stroke-dasharray="4 3" marker-end="url(#hgArrow)"/>
              <circle cx="96" cy="52" r="6" fill="rgba(255,255,255,.85)"/><circle cx="96" cy="52" r="9" fill="none" stroke="rgba(255,255,255,.45)" stroke-width="1.5"/>
              <g class="hDots" fill="#3a3a3a" stroke="#e9cf91" stroke-width="1.5"><circle cx="24" cy="64" r="4.5"/><circle cx="36" cy="64" r="4.5"/><circle cx="48" cy="64" r="4.5"/><circle cx="60" cy="64" r="4.5"/><circle cx="72" cy="64" r="4.5"/></g>
            </svg>
            <div class="sCap">ドラッグでねらう<br><span class="sub">ボールは5個</span></div></div>
          <div class="sArrow">▶</div>
          <div class="step" id="step2"><div class="sNum">2</div>
            <svg class="sPic" viewBox="0 0 110 72" aria-hidden="true">
              <polygon points="38,5 72,5 60,68 50,68" fill="rgba(255,255,255,.16)" stroke="rgba(255,255,255,.85)" stroke-width="1.5" stroke-linejoin="round"/>
              <circle cx="55" cy="66" r="3.5" fill="rgba(244,244,244,.28)"/>
              <circle cx="55" cy="16" r="14" fill="#ffd76a" stroke="#fff" stroke-width="2"/>
              <path d="M34 9l-6-4M33 18h-8M34 26l-6 4M76 9l6-4M77 18h8M76 26l6 4" stroke="#ffd76a" stroke-width="2" stroke-linecap="round"/>
              <text x="98" y="22" font-size="16" font-weight="900" fill="#ffd76a" text-anchor="middle">大</text>
              <text x="80" y="70" font-size="14" font-weight="800" fill="rgba(255,255,255,.4)" text-anchor="middle">小</text>
            </svg>
            <div class="sCap">ゲージが大きい<br>ときに投げる</div></div>
          <div class="sArrow">▶</div>
          <div class="step" id="step3"><div class="sNum">3</div>
            <svg class="sPic" viewBox="0 0 110 72" aria-hidden="true">
              <g transform="translate(6 22)">
                <rect x="0" y="0" width="7" height="7" fill="#0b0b0b" stroke="#d9ad4f" stroke-width=".8"/><rect x="7" y="0" width="7" height="7" fill="#0b0b0b" stroke="#d9ad4f" stroke-width=".8"/><rect x="14" y="0" width="7" height="7" fill="#0b0b0b" stroke="#d9ad4f" stroke-width=".8"/><rect x="21" y="0" width="7" height="7" fill="#e9b949" stroke="rgba(80,50,10,.6)" stroke-width=".8"/><rect x="28" y="0" width="7" height="7" fill="#f2c75a" stroke="rgba(80,50,10,.6)" stroke-width=".8"/><rect x="0" y="7" width="7" height="7" fill="#0b0b0b" stroke="#d9ad4f" stroke-width=".8"/><rect x="7" y="7" width="7" height="7" fill="#0b0b0b" stroke="#d9ad4f" stroke-width=".8"/><rect x="14" y="7" width="7" height="7" fill="#f2c75a" stroke="rgba(80,50,10,.6)" stroke-width=".8"/><rect x="21" y="7" width="7" height="7" fill="#e9b949" stroke="rgba(80,50,10,.6)" stroke-width=".8"/><rect x="28" y="7" width="7" height="7" fill="#f2c75a" stroke="rgba(80,50,10,.6)" stroke-width=".8"/><rect x="0" y="14" width="7" height="7" fill="#0b0b0b" stroke="#d9ad4f" stroke-width=".8"/><rect x="7" y="14" width="7" height="7" fill="#0b0b0b" stroke="#d9ad4f" stroke-width=".8"/><rect x="14" y="14" width="7" height="7" fill="#0b0b0b" stroke="#d9ad4f" stroke-width=".8"/><rect x="21" y="14" width="7" height="7" fill="#f2c75a" stroke="rgba(80,50,10,.6)" stroke-width=".8"/><rect x="28" y="14" width="7" height="7" fill="#e9b949" stroke="rgba(80,50,10,.6)" stroke-width=".8"/><rect x="0" y="21" width="7" height="7" fill="#0b0b0b" stroke="#d9ad4f" stroke-width=".8"/><rect x="7" y="21" width="7" height="7" fill="#e9b949" stroke="rgba(80,50,10,.6)" stroke-width=".8"/><rect x="14" y="21" width="7" height="7" fill="#f2c75a" stroke="rgba(80,50,10,.6)" stroke-width=".8"/><rect x="21" y="21" width="7" height="7" fill="#e9b949" stroke="rgba(80,50,10,.6)" stroke-width=".8"/><rect x="28" y="21" width="7" height="7" fill="#f2c75a" stroke="rgba(80,50,10,.6)" stroke-width=".8"/><rect x="0" y="28" width="7" height="7" fill="#f2c75a" stroke="rgba(80,50,10,.6)" stroke-width=".8"/><rect x="7" y="28" width="7" height="7" fill="#e9b949" stroke="rgba(80,50,10,.6)" stroke-width=".8"/><rect x="14" y="28" width="7" height="7" fill="#f2c75a" stroke="rgba(80,50,10,.6)" stroke-width=".8"/><rect x="21" y="28" width="7" height="7" fill="#e9b949" stroke="rgba(80,50,10,.6)" stroke-width=".8"/><rect x="28" y="28" width="7" height="7" fill="#f2c75a" stroke="rgba(80,50,10,.6)" stroke-width=".8"/>
              </g>
              <g transform="translate(76 38) rotate(-10)">
                <path d="M-26 -22H30V22H-26L-36 0Z" fill="#e8273f" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/>
                <circle cx="-27" cy="0" r="3" fill="#120c14"/>
                <text x="4" y="-1" font-size="22" font-weight="900" fill="#fff" text-anchor="middle">◯%</text>

            </svg>

        </div>
        <button id="startBtn" class="bigBtn">スタート</button>
      </div>
    </div>

    <div id="result" class="screen hidden">
      <div class="card">
        <div class="ribbon">BLACK FRIDAY</div>
        <div id="rPct" class="gold">0<small>%</small></div>
        <div class="rOff">OFF を勝ち取った！</div>
        <div id="rTier"></div>
        <div id="rMsg"></div>
        <div class="rShop">オトクな買い物をしてね</div>
        <div id="rStats"></div>
        <button id="retryBtn" class="bigBtn">もう一度</button>
      </div>
    </div>

  if (!paused) angle += spd * dt;
  simTime += dt; // テスト用：シミュレーション時間（回転速度の実測に使う）
  // v5：ぬり範囲ゲージ。v9：速さは全球一定（周期 ≈ 0.933 s）。固定中（setGauge）は止める
  // v7：投げた瞬間に止まり（飛行中・着弾後の間も止まったまま）、次の球の aim で止まった位相から再開
  if (game && gPinned === null) gPhase = L.stepGauge(gPhase, phase, game.thrown, dt);
  if (gFlashT > 0) { gFlashT -= dt; if (gFlashT <= 0) ui.gauge.classList.remove('hit'); }
  drawGauge();
  wordGroup.rotation.y = angle; mWord.rotation.y = angle;
  if (phase === 'flying') stepFlight(dt);
  else if (phase === 'flyback' && phaseTimer > 0.45) setPhase('aim');
  else if (phase === 'ending' && phaseTimer > 1.3) showResult();
  stepParts(dt); stepPops(dt);
  // 被覆率の数字をなめらかに追従
  if (game) {
    var target = L.percent(game);
    if (shownPct !== target) { shownPct += Math.sign(target - shownPct) * Math.max(1, Math.round(Math.abs(target - shownPct) * 0.2)); if (Math.abs(target - shownPct) < 1) shownPct = target; ui.covNum.innerHTML = shownPct + '<small>%</small>'; }
  }
  // 看板：結果で点灯
  var lit = phase === 'result' ? 1 : 0;
  signMat.opacity += ((lit ? 1 : phase === 'title' ? 0 : 0.28) - signMat.opacity) * Math.min(1, dt * 3);
  // 照準の表示位置
  ui.reticle.style.left = ((ret.x + 1) / 2 * 100) + '%';
  ui.reticle.style.top = ((1 - ret.y) / 2 * 100) + '%';
  // カメラの揺れ
  if (shake > 0) { shake = Math.max(0, shake - dt); var s = shake * 0.12; camera.position.set(CAM_POS.x + (Math.random() - .5) * s, CAM_POS.y + (Math.random() - .5) * s, CAM_POS.z); }
  else camera.position.copy(CAM_POS);
}

newGame();
setPhase('title');
requestAnimationFrame(frame);

// ======================= 告知動画の撮影用の入口（tools/promo、スキル promo-video の約束） =======================
window.__game = {
  manual: function (on) { MANUAL = !!on; last = performance.now(); },
  step: function (dt) { var n = Math.max(1, Math.ceil(dt * 60 - 1e-6)), h = dt / n; for (var i = 0; i < n; i++) tick(h); renderer.render(scene, camera); },
  state: function () {
    return { phase: phase, thrown: game.thrown, ballsLeft: game.ballsLeft, percent: L.percent(game), gauge: gaugeNow(), angle: angle, speed: speed,
      reticle: { x: ret.x, y: ret.y }, last: lastResult };
  },
  start: function () { sfxClick(); start(); },
  throwBall: function () { return throwBall(); },
  touchDown: touchDown, touchMove: touchMove, touchUp: touchUp,
  // 照準を NDC で直接置く／ボクセル座標の点に合わせる（__bf と同じ）
  aim: function (x, y) { ret.x = x; ret.y = y; },
  aimVoxel: function (x, y, z) { var p = projectLocal([x, y, z === undefined ? DEPTH : z]); ret.x = p.x; ret.y = p.y; return p; },
  // ボクセル座標の点が今どこに見えるか（ゲーム画面の CSS ピクセル）。台本のドラッグの行き先を決めるのに使う
  screenOf: function (x, y, z) { var p = projectLocal([x, y, z === undefined ? DEPTH : z]), r = app.getBoundingClientRect(); return { x: (p.x + 1) / 2 * r.width, y: (1 - p.y) / 2 * r.height }; },
  reticlePx: function () { var r = app.getBoundingClientRect(); return { x: (ret.x + 1) / 2 * r.width, y: (1 - ret.y) / 2 * r.height }; },
  dims: { G: G, DEPTH: DEPTH, H: WORD_H },
  setBgmMuted: function (m) { bgmSetMuted(m); },
  drainEvents: function () { var e = EVENTS; EVENTS = []; return e; },
  audio: {
    capture: function (on) { SFX_CAP = !!on; if (on) bgmStop(0.01); },
    drain: function () { var q = SFX_Q; SFX_Q = []; return q; },
    render: function (ctx, name, args, when) { sfxRender(ctx, name, args, when); }
  },
  // 動画用の BGM：ゲームと同じ曲を bpm 一定で sec 秒ぶん書き出し、16bit PCM（モノラル 44.1kHz）を base64 で返す
  renderBgmPcm: function (sec, bpm) {
    var C = window.OfflineAudioContext || window.webkitOfflineAudioContext, sr = 44100, X = new C(1, Math.ceil(sr * sec), sr), g = X.createGain();
    g.gain.value = 1; g.connect(X.destination);
    var sec16 = 60 / bpm / 4;
    for (var i = 0, t = 0; t < sec - 1e-6; i++, t += sec16) bgmStep(X, g, i % BGM_LOOP, t, sec16);
    return X.startRendering().then(function (buf) {
      var d = buf.getChannelData(0), out = new Uint8Array(d.length * 2);
      for (var k = 0; k < d.length; k++) { var v = Math.max(-1, Math.min(1, d[k])) * 32767 | 0; out[k * 2] = v & 255; out[k * 2 + 1] = (v >> 8) & 255; }
      var bin = ''; for (var j = 0; j < out.length; j += 0x8000) bin += String.fromCharCode.apply(null, out.subarray(j, j + 0x8000));
      return btoa(bin);
    });
  }
};

// ======================= テスト用フック =======================
window.__bf = {
  state: function () {
    return { phase: phase, ballsLeft: game.ballsLeft, thrown: game.thrown, percent: L.percent(game), coverage: L.coverage(game),
      painted: game.paintedCount, total: game.total, voxels: model.count, angle: angle, speed: speed, paused: paused, simTime: simTime,
      gauge: gaugeNow(), gaugePhase: gPhase, gaugePinned: gPinned !== null, gaugeFrozen: gPinned === null && !L.gaugeRuns(phase), gaugeMult: L.gaugeSpeedMult(game.thrown),
      locked: game.locked ? { gauge: game.locked.gauge, radius: game.locked.radius, range: game.locked.range } : null, lastThrowGauge: lastThrowGauge,
      reticle: { x: ret.x, y: ret.y }, last: lastResult, flying: !!flight && phase === 'flying', history: game.history.slice() };
  },
  start: function () { start(); },
  // BGM の状態と、オフラインで sec 秒ぶん書き出したときの音量（RMS／ピーク、BGM_VOL を掛けた値）
  bgm: function () { return { on: bgm.on, muted: bgm.muted, bpm: bgm.bpm, step: bgm.step, timer: !!bgm.timer, ctx: AC ? AC.state : null }; },
  setBgmMuted: function (m) { bgmSetMuted(m); return bgm.muted; },
  renderBgm: function (sec, thrown) {
    var C = window.OfflineAudioContext || window.webkitOfflineAudioContext, sr = 44100, X = new C(1, Math.ceil(sr * sec), sr), g = X.createGain();
    g.gain.value = BGM_VOL; g.connect(X.destination);
    var sec16 = 60 / (BGM_BPM + BGM_BPM_STEP * (thrown || 0)) / 4;
    for (var i = 0, t = 0.01; t < sec - 0.3; i++, t += sec16) bgmStep(X, g, i % BGM_LOOP, t, sec16);
    return X.startRendering().then(function (buf) { var d = buf.getChannelData(0), s = 0, pk = 0; for (var k = 0; k < d.length; k++) { s += d[k] * d[k]; pk = Math.max(pk, Math.abs(d[k])); } return { rms: Math.sqrt(s / d.length), peak: pk }; });
  },
  retry: function () { start(); },
  aim: function (x, y) { ret.x = x; ret.y = y; return { x: ret.x, y: ret.y }; },
  // ボクセル座標の点（x, y, z）を現在の角度で画面に投影し、そこに照準を合わせる
  aimVoxel: function (x, y, z) { var p = projectLocal([x, y, z === undefined ? DEPTH : z]); ret.x = p.x; ret.y = p.y; return p; },
  letters: function () { return built.letters.map(function (l) { return { cx: l.cx, cy: l.cy, hw: l.hw, hh: l.hh }; }); },
  dims: { G: G, DEPTH: DEPTH, H: WORD_H },
  // v10：タイトル画面のカメラ（zoom / 上下シフト）と、回る文字の画面上の上端・下端（px）
  titleCam: function () { var a = app.getBoundingClientRect().height; return { zoom: titleCam.zoom, dy: titleCam.dy, band: titleCam.band, cameraZoom: camera.zoom, viewOffset: !!(camera.view && camera.view.enabled),
    wordTop: (1 - projectLocal([G / 2, WORD_H, DEPTH / 2]).y) / 2 * a, wordBottom: (1 - projectLocal([G / 2, 0, DEPTH / 2]).y) / 2 * a }; },
  throwBall: function () { return throwBall(); },
  // テスト用：着弾点 p から半径 r 以内の表面ブロック数（新しい盤面で数える。実ゲームの状態は変えない）
  countWithin: function (p, r) { return L.paint(L.createGame(model, []), p, r).length; },
  // v5：ぬり範囲ゲージ。setGauge(g) で値を固定（固定中は位相も止まる）、unpinGauge() でその値から再び往復
  getGauge: function () { return gaugeNow(); },
  get lastThrowGauge() { return lastThrowGauge; }, // v6：投げた瞬間に確定したゲージ値
  locked: function () { return game.locked ? { gauge: game.locked.gauge, radius: game.locked.radius, range: game.locked.range } : null; },
  setGauge: function (g) { gPinned = Math.max(0, Math.min(1, +g)); drawGauge(); return gPinned; },
  unpinGauge: function () { if (gPinned !== null) { gPhase = Math.acos(1 - 2 * gPinned); gPinned = null; } return gaugeNow(); },
  // 描画に使われる文字の Y 回転（wordGroup.matrixWorld から復元、(-π, π] に折り返し）。回転速度の実測用
  renderedAngle: function () { wordGroup.updateMatrixWorld(true); var e = wordGroup.matrixWorld.elements; return Math.atan2(e[8], e[0]); },
  setRotation: function (a, p) { if (a !== null && a !== undefined) angle = a; if (p !== undefined) paused = !!p; return { angle: angle, paused: paused }; },
  moveReticle: moveReticle,
  // 文字付近の画面ピクセルを数える（金っぽい／黒っぽい）。preserveDrawingBuffer を使用
  pixelStats: function () {
    var w = canvas.width, h = canvas.height, cv = document.createElement('canvas'); cv.width = w; cv.height = h;
    var g = cv.getContext('2d'); g.drawImage(canvas, 0, 0);
    var tl = projectLocal([-2, WORD_H + 2, DEPTH / 2]), br = projectLocal([G + 2, -1, DEPTH / 2]);
    var x0 = Math.max(0, Math.floor((Math.min(tl.x, br.x) + 1) / 2 * w) - 20), x1 = Math.min(w, Math.ceil((Math.max(tl.x, br.x) + 1) / 2 * w) + 20);
    var y0 = Math.max(0, Math.floor((1 - tl.y) / 2 * h)), y1 = Math.min(h, Math.ceil((1 - br.y) / 2 * h));
    var d = g.getImageData(x0, y0, x1 - x0, y1 - y0).data, gold = 0, black = 0;
    for (var i = 0; i < d.length; i += 4) {
      var r = d[i], gg = d[i + 1], b = d[i + 2];
      if (r > 150 && gg > 95 && b < gg * 0.75 && r > b + 70) gold++;
      else if (d[i + 3] > 200 && r < 28 && gg < 28 && b < 28) black++;
    }
    return { gold: gold, black: black, box: [x0, y0, x1, y1] };
  }
};
})();
</script>
